      <g id="block1" transform="translate(0,0)">
  <text x="40.0" y="45" font-family="Verdana, Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FF4D4D">◆ “It&#x27;s not who I am underneath, but what I do that defines me.” — BATMAN</text>
  <text x="989.1" y="45" font-family="Verdana, Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFC300">⚡ “I am Iron Man.” — TONY STARK</text>
  <text x="1462.9" y="45" font-family="Verdana, Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FF4D4D">◆ “Why do we fall? So we can learn to pick ourselves up.” — BATMAN</text>
  <text x="2333.8" y="45" font-family="Verdana, Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFC300">⚡ “Sometimes you gotta run before you can walk.” — TONY STARK</text>
  <text x="3172.5" y="45" font-family="Verdana, Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FF4D4D">◆ “It&#x27;s not the mask that makes you the hero, it&#x27;s the man underneath.” — BATMAN</text>
  <text x="4206.8" y="45" font-family="Verdana, Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFC300">⚡ “Part of the journey is the end.” — TONY STARK</text>
  </g>
